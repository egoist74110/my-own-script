[package]
name = "toolbox-desktop"
version = "1.0.0"
description = "TOOLBOX desktop shell (Tauri 2): window, tray and Python backend supervision"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "toolbox_desktop_lib"

[[bin]]
name = "toolbox-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "io-util", "sync", "time", "macros", "signal"] }
libc = "0.2"
shlex = "1"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
