[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "my-own-script"
version = "0.1.0"
description = "Remote release execution runner (stubbed providers)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Wesker" }]
license = { text = "MIT" }
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.6.0",
  "PyYAML>=6.0.1",
  "keyring>=25.0.0",
  "PySide6>=6.6.0",
]

[project.scripts]
my-own-script = "runner_app.cli:app"
my-own-script-ui = "ui_app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["runner_app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
reportMissingTypeStubs = false
